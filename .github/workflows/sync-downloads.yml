# Keeps dabingabongo.com/downloads in sync with this repo: every push to
# main that changes the lyric_chunker/ package builds the legacy
# single-file add-on and copies it into the Dabingabongo repo, refreshing
# its downloads.json entry, which kicks off the site's Netlify deploy.
#
# The package itself (blender_manifest.toml) is the canonical source and
# what ships to Superhive as an Extension zip; the site keeps getting a
# single .py, flattened by scripts/build_single_file.py.
#
# Requires a LYRIC_CHUNKER_SYNC repo secret — a fine-grained PAT with
# Contents: Read and write on mikeyd433/Dabingabongo.
name: Sync to dabingabongo downloads

on:
  push:
    branches: [main]
    paths:
      - lyric_chunker/**
      - scripts/build_single_file.py
      - scripts/sync_downloads.py
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out LyricChunker
        uses: actions/checkout@v4

      - name: Check out Dabingabongo
        uses: actions/checkout@v4
        with:
          repository: mikeyd433/Dabingabongo
          token: ${{ secrets.LYRIC_CHUNKER_SYNC }}
          path: site

      - name: Run tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q

      - name: Build single-file add-on
        run: python3 scripts/build_single_file.py --out build/lyric_chunker.py

      - name: Update download file and manifest
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/sync_downloads.py build/lyric_chunker.py site \
            --note "$COMMIT_SUBJECT" \
            --commit-sha "$GITHUB_SHA"

      - name: Commit and push to Dabingabongo
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/lyric_chunker.py downloads.json
          if git diff --cached --quiet; then
            echo "Downloads page already up to date."
            exit 0
          fi
          git commit -m "Sync Lyric Chunker from LyricChunker@${GITHUB_SHA::7}"
          git push
